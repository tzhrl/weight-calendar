<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F5F2">
<title>体重日历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141316'/%3E%3Crect x='14' y='17' width='36' height='33' rx='5' fill='none' stroke='%23F6F5F2' stroke-width='3'/%3E%3Cline x1='14' y1='27' x2='50' y2='27' stroke='%23F6F5F2' stroke-width='3'/%3E%3Ccircle cx='32' cy='39' r='4' fill='%23C93F27'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F5F2;
  --ink:#141316;
  --muted:#8E8A82;
  --card:#E9E6DF;
  --card-soft:#EFEDE7;
  --line:rgba(20,19,22,.07);
  --up:#C93F27;
  --down:#2E8850;
  --ink-2:#6E6A63;
  --ink-3:#8A867E;
  --ink-4:#A8A49C;
  --ink-5:#C6C2BA;
  --fill:rgba(20,19,22,.055);
  --fill-soft:rgba(20,19,22,.045);
  --fill-2:rgba(20,19,22,.06);
  --cal-off:94px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;left:0;right:0;top:0;height:340px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 50% 0%,#FCFBF8 0%,rgba(252,251,248,0) 72%);
}
.shell{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:0 15px calc(100px + env(safe-area-inset-bottom))}

/* ---------- 标题 / 月份切换 ---------- */
h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;padding-top:26px}
.head-main{display:flex;align-items:flex-end;gap:9px;min-width:0}
.head-w{display:flex;align-items:baseline;gap:5px;font-size:33px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.head-w .head-u{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.head-bmi{
  display:inline-flex;align-items:center;gap:5px;border:0;background:var(--fill);border-radius:999px;
  padding:5px 10px 5.5px 9px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;
  letter-spacing:.01em;font-variant-numeric:tabular-nums;margin-bottom:2px;white-space:nowrap;
}
.head-bmi:active{background:rgba(20,19,22,.1)}
.head-note{font-size:11px;color:var(--ink-4);padding-bottom:8px;letter-spacing:.02em}
.goal-line{font-size:11px;color:var(--ink-3);margin:9px 0 -2px;letter-spacing:.01em;cursor:pointer}
.goal-line[hidden]{display:none}
.goal-line b{font-weight:600}
.goal-line.up b{color:var(--up)}
.goal-line.ok b{color:var(--down)}
.unit-tog{display:inline-flex;align-items:center;background:var(--fill);border-radius:999px;padding:2px;margin-bottom:2px}
.ut{border:0;background:none;font-family:inherit;font-size:11.5px;font-weight:500;color:var(--ink-3);padding:5px 8px;border-radius:999px;cursor:pointer;line-height:1;white-space:nowrap}
.ut.on{color:var(--ink);font-weight:700;background:#fff}

.monthbar{display:flex;align-items:center;gap:1px;margin-top:16px}
.month-title{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 8px}
.chev{width:34px;height:34px;border:0;background:none;display:grid;place-items:center;color:var(--ink);padding:0;border-radius:50%;cursor:pointer}
.chev svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.chev:active{background:var(--fill-2)}
.today-btn{margin-left:auto;border:0;background:none;color:#5C4E2E;font-size:16px;font-weight:600;padding:4px 2px;cursor:pointer;letter-spacing:.01em;line-height:1.1}
.help-btn{margin-left:6px;width:19px;height:19px;border:0;border-radius:50%;background:var(--fill);color:#141316;font-family:inherit;font-size:12px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer;position:relative}
.help-btn::before{content:"";position:absolute;inset:-8px -10px -8px -2px}  /* 圆点小了，向四周扩点按余量（左侧少扩，别抢「今天」的点击） */
.help-btn:active{background:rgba(20,19,22,.12)}

.weekhead{display:grid;grid-template-columns:repeat(7,1fr);column-gap:2px;margin-top:12px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-align:center}

/* ---------- 日历（撑满剩余高度） ---------- */
#page-calendar{display:flex;flex-direction:column;min-height:calc(100vh - var(--cal-off))}
#page-calendar[hidden]{display:none}.calendar{
  display:grid;grid-template-columns:repeat(7,1fr);column-gap:2px;row-gap:5px;margin-top:8px;
  touch-action:pan-y;grid-auto-rows:minmax(56px,auto);position:relative;
}
@supports (height:100dvh){
  #page-calendar{min-height:calc(100dvh - var(--cal-off))}
}
.day{
  border:0;background:none;font:inherit;color:inherit;padding:5px 0 2px;cursor:pointer;
  min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;
  border-radius:14px;position:relative;transition:background .18s ease;
}
.day .dnum{font-size:18px;font-weight:600;line-height:1.15}
.day .dwt{font-size:17px;font-weight:500;color:var(--ink-3);line-height:1.15;letter-spacing:0;font-variant-numeric:tabular-nums;margin-top:8px}
.day .dlt{font-size:15px;line-height:1.15;font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums;margin-top:2px;margin-bottom:2px}
.day.ghost .dnum{color:#C7C3BB}
.day.ghost .dwt{color:#BDB9B1}
.day.sel,.day:active{background:#E7E4DC}
.day.today{background:#141316;color:#F6F5F2}
.day.today .dnum{color:#FBF9F5}
.day.today .dwt{color:#FFFFFF}
.day.today:active{background:#2B2723}

/* ---------- 涨跌标记 ---------- */
.dlt{display:inline-flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.dlt .dunit{font-size:9.5px;font-weight:500;color:var(--ink-3);text-decoration:none;letter-spacing:0}
.dlt.u{color:var(--up)}
.dlt.d{color:var(--down)}
.dlt.f,.dlt.n{color:#9B978F}
.day.today .dlt.u{color:#F28063}
.day.today .dlt.d{color:#6CC68F}
.day.today .dlt.f,.day.today .dlt.n{color:#A8A39B}
.tri{width:7px;height:7px;fill:currentColor;flex:0 0 auto;display:block}
.num-up{color:var(--up)}
.num-down{color:var(--down)}

/* ---------- 月度统计 ---------- */
.summary{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:20px;padding:16px 3px 15px;margin-top:10px}
.stat{text-align:center;min-width:0}
.stat .k{font-size:11px;color:var(--ink-3);letter-spacing:.03em;white-space:nowrap}
.stat .v{margin-top:7px;font-size:16px;font-weight:600;line-height:1.2;display:block}
.stat .v .unit{font-size:10.5px;color:var(--ink-3);font-weight:500;margin-left:2px}
.stat .mt{color:var(--ink-4)}
.stat .tri{width:8px;height:8px}

/* ---------- 体围页 ---------- */
.mselect{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:22px}
.mchip{
  border:0;cursor:pointer;background:var(--card-soft);border-radius:13px;padding:9px 0 10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);font-family:inherit;
  transition:background .18s ease,color .18s ease;min-width:0;
}
.mchip .mk{font-size:9px;color:var(--ink-3);white-space:nowrap}
.mchip .mv{font-size:11.5px;font-weight:600;letter-spacing:-.03em}
.mchip.on{background:#17151A;color:#fff}
.mchip.on .mk{color:#fff}

.hero{background:var(--card);border-radius:22px;padding:18px 16px 17px;margin-top:14px}
.hero-top{min-height:42px}
.hero-main{display:flex;align-items:baseline;gap:4px}
.hero-val{font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1}
.hero-unit{font-size:10.5px;color:var(--ink-3)}
.hero-delta{font-size:13.5px;font-weight:600;margin-left:4px}
.hero-meta{font-size:10.5px;color:var(--ink-3);margin-top:6px}
.hero-empty{font-size:13px;color:var(--ink-3);line-height:1.6;padding:6px 0 4px}

.hist{margin-top:24px}
.hist-head{display:flex;align-items:baseline;justify-content:space-between}
.hist-title{font-size:13px;font-weight:600;letter-spacing:.01em}
.hist-count{font-size:10.5px;color:var(--ink-4)}
.hist-note{font-size:10.5px;color:var(--ink-3);line-height:1.65;margin:6px 0 0}
.hist-note + #bk-list{margin-top:12px}
.mrow{background:var(--card-soft);border-radius:18px;padding:12px 13px 11px;margin-top:9px}
.mrow-head{display:flex;align-items:center;gap:6px}
.mrow-date{font-size:11.5px;font-weight:600}
.mrow-edit{font-size:10.5px;color:var(--ink-2);background:none;border:0;padding:4px 0 4px 6px;cursor:pointer;font-family:inherit}
.mrow-body{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;margin-top:9px}
.mrow-del{margin-left:auto;font-size:10.5px;color:var(--ink-4);background:none;border:0;padding:4px 0;cursor:pointer;font-family:inherit}
.mrow-del:active{color:var(--up)}
.mcell{text-align:center;min-width:0}
.mcell .k{font-size:10.5px;color:var(--muted)}
.mcell .v{font-size:11.5px;font-weight:600;margin-top:3px;line-height:1.2;letter-spacing:-.02em}
.mcell .dlt{font-size:8.5px;margin-top:2px;display:flex;justify-content:center}
.mcell .tri{width:5px;height:5px}
.empty-note{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:14px}
.more-btn{display:block;width:100%;margin-top:9px;border:0;background:var(--card-soft);border-radius:18px;padding:13px 0;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;letter-spacing:.01em}
.more-btn:active{background:#E4E0D6}

.clear-btn{display:block;border:0;background:none;color:var(--ink-4);font-size:11px;padding:8px;cursor:pointer;font-family:inherit;margin:32px auto 0}
.clear-btn:active{color:var(--up)}

/* ---------- 体重页：按月分组的记录列表 ---------- */
.wgroup{margin-top:20px}
.wgroup-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 3px 0 2px}
.wgroup-head .t{font-size:12.5px;font-weight:600;letter-spacing:.01em}
.wgroup-head .n{font-size:10.5px;color:var(--ink-4)}
.wgroup-head .n .dlt{font-size:11.5px;margin-left:6px}
.wrowitem{
  display:flex;align-items:center;gap:8px;background:var(--card-soft);border-radius:15px;
  padding:10px 12px;margin-top:7px;
}
.wri-d{flex:0 0 auto;width:32px;text-align:center;line-height:1.1}
.wri-d b{display:block;font-size:15px;font-weight:600}
.wri-d i{display:block;font-style:normal;font-size:10px;color:var(--ink-3);margin-top:2px}
.wri-w{margin-left:auto;display:flex;align-items:baseline;gap:3px;font-size:17px;font-weight:600;letter-spacing:-.025em;position:relative;cursor:pointer}
.wri-w::before{content:"";position:absolute;left:-7px;right:-4px;top:-7px;bottom:-7px}  /* 只让体重数字这块好点，不改变行内排版 */
.wri-w:active{opacity:.55}
.wri-w u{text-decoration:none;font-size:10px;font-weight:500;color:var(--ink-3)}
.wri-dt{flex:0 0 auto;width:48px;display:flex;justify-content:flex-end;font-size:12px}
.wri-del{flex:0 0 auto;border:0;background:none;font-family:inherit;font-size:11px;color:var(--ink-4);padding:8px 2px 8px 12px;cursor:pointer}
.wri-del:active{color:var(--up)}
.w-empty{text-align:center;margin-top:36px;color:var(--ink-4)}

/* ---------- 备份页 ---------- */
.bcard{background:var(--card);border-radius:22px;padding:2px 16px;margin-top:22px}
.brow{display:flex;align-items:center;gap:10px;padding:18px 0;border-top:1px solid var(--fill-2)}
.brow:first-child{border-top:0}
.brow-main{min-width:0}
.blabel{font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.bbtn{margin-left:auto;flex:0 0 auto;border:0;background:rgba(20,19,22,.07);border-radius:999px;padding:8px 13px;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.breset-btn{margin-left:auto;flex:0 0 auto;border:0;background:rgba(201,63,39,.1);border-radius:999px;padding:8px 14px;font-family:inherit;font-size:12px;font-weight:600;color:var(--up);cursor:pointer;white-space:nowrap}
.breset-btn:active{background:rgba(201,63,39,.18)}
.bbtn:active{background:rgba(20,19,22,.12)}
.bitem{display:flex;align-items:center;gap:8px;background:var(--card-soft);border-radius:18px;padding:12px 13px 12px 14px;margin-top:9px}
.bitem-l{min-width:0}
.bitem-time{font-size:12.5px;font-weight:600;white-space:nowrap}
.bitem-meta{font-size:10.5px;color:var(--ink-3);margin-top:5px}
.bitem-acts{margin-left:auto;display:flex;align-items:center;gap:1px;flex:0 0 auto}
.bitem-acts button{border:0;background:none;font-family:inherit;font-size:10.5px;color:var(--ink-2);padding:7px 6px;cursor:pointer;border-radius:8px}
.bitem-acts button:active{background:var(--fill-2)}
.bitem-acts button.del{color:var(--ink-4)}
.bk-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-left:7px;vertical-align:9px}
.bk-dot[hidden]{display:none}
.bk-remind{font-size:10.5px;color:#B4552A;line-height:1.65;margin:8px 0 0}
.bk-remind[hidden]{display:none}

.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;pointer-events:none;
  transform:translate(-50%,10px);opacity:0;transition:opacity .2s ease,transform .2s ease;
  background:#17151A;color:#fff;font-size:12px;line-height:1.4;padding:10px 16px;border-radius:999px;
  max-width:80%;text-align:center;box-shadow:0 8px 24px rgba(20,19,22,.24);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 用法小教程 ---------- */
.help-tip{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:0 30px;background:rgba(20,19,22,.2)}
.help-tip[hidden]{display:none}
.help-card{background:#FBFAF7;border-radius:18px;padding:15px 22px 14px;box-shadow:0 18px 40px rgba(20,19,22,.18);max-width:300px}
.help-card p{margin:0;font-size:13px;line-height:2.05;color:#807A72;letter-spacing:.01em;white-space:nowrap}
.help-card b{color:#141316;font-weight:600}

/* ---------- 底部标签栏 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:30;pointer-events:none;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
}
.tabbar-inner{
  pointer-events:auto;width:100%;max-width:404px;display:grid;grid-template-columns:repeat(2,1fr) 46px repeat(2,1fr);gap:4px;
  background:rgba(251,250,247,.9);border-radius:22px;padding:6px;
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 26px rgba(20,19,22,.1),0 0 0 1px rgba(20,19,22,.05);
}
.tab-add{
  border:0;background:var(--ink);color:#fff;border-radius:50%;cursor:pointer;font-family:inherit;
  display:grid;place-items:center;align-self:center;justify-self:center;width:42px;height:42px;
  box-shadow:0 4px 14px rgba(20,19,22,.18);transition:background .18s ease,transform .12s ease;
}
.tab-add svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none}
.tab-add:active{background:#2E2B33;transform:scale(.94)}
.tab-add[hidden]{display:none}
.tabbar-inner.no-add{grid-template-columns:repeat(4,1fr)}
.tab{
  border:0;background:none;font-family:inherit;cursor:pointer;color:var(--ink-3);font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:16px;
  transition:background .2s ease,color .2s ease;
}
.tab svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.6;fill:none}
.tab.on{color:var(--ink);background:var(--fill)}
.tab:active{background:rgba(20,19,22,.04)}

/* ---------- 弹层 ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,19,22,.38);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:50}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;display:flex;justify-content:center;
  transform:translateY(101%);transition:transform .34s cubic-bezier(.22,1,.36,1);pointer-events:none;
}
.sheet.on{transform:translateY(0);pointer-events:auto}
.sheet-inner{
  width:100%;max-width:440px;background:#FBFAF7;border-radius:26px 26px 0 0;
  padding:10px 22px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  box-shadow:0 -12px 40px rgba(20,19,22,.14);
}
.handle{width:38px;height:4px;border-radius:2px;background:#DBD7CE;margin:0 auto 14px}
.sheet-head{display:flex;align-items:flex-start}
.sheet-title{font-size:18px;font-weight:600;letter-spacing:-.02em;margin:0}
.sheet-sub{font-size:11px;color:var(--muted);margin-top:5px}
.close-btn{margin-left:auto;width:28px;height:28px;border:0;border-radius:50%;background:var(--fill-2);display:grid;place-items:center;color:var(--ink);cursor:pointer}
.close-btn svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none}

/* 记录体重：大数字 + 上下拖动刻度 */
.wbig{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:16px;cursor:text;user-select:none;-webkit-user-select:none}
.wbig .v{font-size:44px;font-weight:600;letter-spacing:-.045em;line-height:1.05;font-variant-numeric:tabular-nums}
.wunits{display:inline-flex;align-items:baseline;gap:6px}
.wunit{font-size:12.5px;font-weight:500;color:var(--ink-4);cursor:pointer;letter-spacing:.01em}
.wunit.on{font-size:19px;font-weight:700;color:var(--ink)}
.wsep{font-size:13px;color:var(--ink-5)}
.wbig .u{font-size:13px;color:var(--muted);font-weight:500}
.winput{
  display:none;width:100%;border:0;background:none;text-align:center;font-family:inherit;outline:none;
  font-size:44px;font-weight:600;letter-spacing:-.045em;padding:0;margin-top:16px;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.wsrc{font-size:11px;color:var(--muted);text-align:center;margin:8px 0 0}
.wpick{
  position:relative;height:210px;margin-top:4px;overflow:hidden;touch-action:none;
  user-select:none;-webkit-user-select:none;cursor:ns-resize;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,0),#000 20%,#000 80%,rgba(0,0,0,0));
  mask-image:linear-gradient(to bottom,rgba(0,0,0,0),#000 20%,#000 80%,rgba(0,0,0,0));
}
.wpick-band{position:absolute;left:0;right:0;top:84px;height:42px;border-radius:11px;background:var(--fill);pointer-events:none}
.wscale{position:absolute;left:0;right:0;top:0;will-change:transform}
.wrow{height:42px;line-height:42px;text-align:center;font-size:15px;color:#ABA79E;font-variant-numeric:tabular-nums}
.wrow.mid{font-size:19px;font-weight:600;color:var(--ink)}
.btn-primary.tall{font-size:16px;padding:17px;margin-top:20px;border-radius:18px}
.sheet-hint{font-size:11px;color:var(--muted);text-align:center;margin:10px 0 0;min-height:16px}
.sheet-hint.err{color:var(--up)}

.datepill{
  display:flex;align-items:center;justify-content:center;margin:10px auto 0;width:max-content;
  background:var(--fill-soft);border-radius:999px;padding:7px 13px 7px 14px;
}
.datepill input[type="date"]{
  border:0;background:none;font-family:inherit;font-size:13px;font-weight:600;color:#4A4640;
  letter-spacing:.01em;outline:none;padding:0;text-align:center;cursor:pointer;
}

.mform{margin-top:14px}
.frow{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.flabel{font-size:13px;font-weight:500;width:66px;flex:0 0 auto}
.finput{
  flex:1;min-width:0;border:0;background:none;font-family:inherit;font-size:17px;font-weight:600;
  text-align:right;padding:0 4px;outline:none;color:var(--ink);letter-spacing:-.01em;
}
.finput::placeholder{color:var(--ink-5);font-weight:500}
.funit{font-size:10.5px;color:var(--muted);width:22px;text-align:right;flex:0 0 auto}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type="number"]{-moz-appearance:textfield;appearance:textfield}
input[type="date"]::-webkit-calendar-picker-indicator{opacity:.45}

.btn-primary{
  width:100%;border:0;border-radius:16px;background:#17151A;color:#fff;font-family:inherit;
  font-size:15px;font-weight:600;padding:15px;margin-top:18px;cursor:pointer;letter-spacing:.01em;
}
.btn-primary:active{transform:scale(.985)}
.btn-primary.half{flex:1;width:auto;margin-top:0;background:var(--up)}
.confirm-acts{display:flex;gap:10px;margin-top:20px}
.btn-soft{flex:1;border:0;border-radius:16px;background:var(--card-soft);color:var(--ink);font-family:inherit;font-size:15px;font-weight:600;padding:15px;cursor:pointer}
.btn-danger{width:100%;border:0;background:none;color:var(--up);font-family:inherit;font-size:12px;font-weight:500;padding:13px 0 2px;cursor:pointer}
.imp-acts{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.imp-acts .btn-primary{width:100%;margin-top:0}
.imp-acts .btn-soft{width:100%;flex:none;background:var(--card-soft)}
.imp-cancel{border:0;background:none;font-family:inherit;font-size:13px;color:var(--ink-3);padding:11px 0 2px;cursor:pointer}

@media (max-width:360px){
  .day{min-height:54px}
  .day .dnum{font-size:15px}
  h1{font-size:24px}
  .head-w{font-size:29px}
  .head-bmi{font-size:12px}
}
/* 中等高度（约 740px 的安卓屏）先收一点行距，避免统计卡被标签栏压住 */
@media (max-height:780px){
  .page-head{padding-top:18px}
  .head-w{font-size:31px}
  .monthbar{margin-top:12px}
  .month-title{font-size:20px}
  .weekhead{margin-top:9px;font-size:11.5px}
  .calendar{row-gap:6px;grid-auto-rows:minmax(48px,1fr)}
  .day{min-height:48px;padding:4px 0 2px;gap:2px}
  .day .dnum{font-size:17px}
  .day .dwt{font-size:15px;margin-top:6px}
  .day .dlt{font-size:13.5px;margin-top:1px}
  .summary{margin-top:9px;padding:12px 2px 12px}
  .stat .v{margin-top:6px;font-size:15px}
}
/* 矮屏（如 375×667）压缩纵向节奏，让统计卡与选中日不被标签栏遮住 */
@media (max-height:720px){
  .page-head{padding-top:16px}
  h1{font-size:23px}
  .head-w{font-size:30px}
  .head-bmi{font-size:12px}
  .monthbar{margin-top:10px}
  .month-title{font-size:18px}
  .weekhead{margin-top:8px;font-size:11px}
  .calendar{row-gap:5px;grid-auto-rows:minmax(50px,1fr)}
  .day{min-height:50px;padding:4px 0 2px;gap:2px}
  .day .dnum{font-size:16px}
  .day .dwt{font-size:14px;margin-top:5px}
  .day .dlt{font-size:12px;margin-top:1px}
  .summary{margin-top:8px;padding:11px 2px 10px}
  .stat .v{margin-top:5px;font-size:14.5px}
  .hero{padding:14px 14px;margin-top:10px}
  .mselect{margin-top:14px}
  .hist{margin-top:18px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
/* 更矮的屏（约 667px）再收一档，保证统计卡不被标签栏压住 */
@media (max-height:700px){
  .shell{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
  .page-head{padding-top:12px}
  .head-w{font-size:27px}
  .head-bmi{font-size:11.5px;padding:4px 8px 4.5px 7px}
  .monthbar{margin-top:8px}
  .month-title{font-size:17px}
  .chev{width:30px;height:30px}
  .weekhead{margin-top:6px}
  .calendar{row-gap:4px;grid-auto-rows:minmax(42px,1fr);margin-top:6px}
  .day{min-height:42px;padding:3px 0 2px;gap:2px}
  .day .dnum{font-size:15px}
  .day .dwt{font-size:12.5px;line-height:1.2;margin-top:3px}
  .day .dlt{font-size:11px;line-height:1.3;margin-top:1px}
  .summary{margin-top:7px;padding:9px 2px 9px}
  .stat .k{font-size:10px}
  .stat .v{margin-top:4px;font-size:13.5px}
}
</style>
</head>
<body>
<div class="shell">

<!-- ===== 视图：体重（按月分组的记录） ===== -->
<section id="page-weight" hidden>
  <div class="page-head">
    <h1>体重</h1>
    <div class="unit-tog">
      <button class="ut" data-unit-set="jin">斤</button>
      <button class="ut" data-unit-set="kg">公斤</button>
    </div>
  </div>
  <div id="w-list"></div>
  <button class="clear-btn" id="clear-weight">清空体重记录</button>
</section>

<!-- ===== 视图：日历 ===== -->
<section id="page-calendar">
  <div class="page-head">
    <div class="head-main">
      <div class="head-w" id="head-weight"></div>
      <button class="head-bmi" id="open-bmi">BMI <span id="head-bmi">—</span></button>
    </div>
    <div class="unit-tog">
      <button class="ut" data-unit-set="jin">斤</button>
      <button class="ut" data-unit-set="kg">公斤</button>
    </div>
  </div>

  <div class="goal-line" id="goal-line" hidden></div>

  <div class="monthbar">
    <button class="chev" id="prev-month"><svg viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg></button>
    <span class="month-title" id="month-title"></span>
    <button class="chev" id="next-month"><svg viewBox="0 0 24 24"><path d="M9 4.5l7.5 7.5L9 19.5"/></svg></button>
    <button class="today-btn" id="go-today">今天</button>
    <button class="help-btn" id="help-btn">?</button>
  </div>

  <div class="weekhead">
    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
  </div>

  <div class="calendar" id="calendar"></div>

  <div class="summary" id="summary"></div>
</section>

<!-- ===== 视图：体围 ===== -->
<section id="page-measure" hidden>
  <div class="page-head">
    <h1>体围</h1>
  </div>

  <div class="mselect" id="mselect"></div>

  <div class="hero">
    <div class="hero-top" id="hero-top"></div>
  </div>

  <div class="hist">
    <div class="hist-head">
      <span class="hist-title">历史记录</span>
      <span class="hist-count" id="hist-count"></span>
    </div>
    <div id="hist-list"></div>
  </div>

  <button class="clear-btn" id="clear-all">清空体围记录</button>
</section>

<!-- ===== 视图：备份 ===== -->
<section id="page-backup" hidden>
  <div class="page-head">
    <h1>备份<span class="bk-dot" id="bk-dot" hidden></span></h1>
    <span class="head-note">仅存本机</span>
  </div>

  <div class="bcard">
    <div class="brow">
      <div class="brow-main">
        <div class="blabel">备份到手机本地</div>
      </div>
      <button class="bbtn" id="backup-now">备份</button>
    </div>
    <div class="brow">
      <div class="brow-main">
        <div class="blabel">重置数据</div>
      </div>
      <button class="breset-btn" id="reset-data">重置</button>
    </div>
    <div class="brow">
      <div class="brow-main">
        <div class="blabel">导入文件</div>
      </div>
      <button class="bbtn" id="import-file">导入</button>
    </div>
  </div>

  <div class="hist">
    <div class="hist-head">
      <span class="hist-title">备份记录</span>
      <span class="hist-count" id="bk-count"></span>
    </div>
    <p class="bk-remind" id="bk-remind" hidden></p>
    <p class="hist-note">数据仅存于本机浏览器。需点按上方「备份到手机本地」另存副本；否则清除浏览器缓存时，全部记录将一并清除。</p>
    <div id="bk-list"></div>
  </div>
</section>

</div>

<div class="help-tip" id="help-tip" hidden>
  <div class="help-card">
    <p><b>双击日期</b>记录当天体重</p>
    <p><b>长按日期</b>删除当天体重</p>
  </div>
</div>

<nav class="tabbar">
  <div class="tabbar-inner">
    <button class="tab" data-tab="weight">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15.5" rx="5"/><path d="M8.6 15.4a3.4 3.4 0 0 1 6.8 0"/></svg>
      <span>体重</span>
    </button>
    <button class="tab on" data-tab="calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10.5h18M8 3v4M16 3v4"/></svg>
      <span>日历</span>
    </button>
    <button class="tab-add" id="tab-add" title="记录">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-tab="measure">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="9" width="19" height="6" rx="1.6"/><path d="M7.5 9v2.4M12 9v3.2M16.5 9v2.4"/></svg>
      <span>体围</span>
    </button>
    <button class="tab" data-tab="backup">
      <svg viewBox="0 0 24 24"><path d="M12 4.2v10.2"/><path d="M8 10.4 12 14.4l4-4"/><path d="M4.8 15.6v3.2A1.6 1.6 0 006.4 20.4h11.2A1.6 1.6 0 0019.2 18.8v-3.2"/></svg>
      <span>备份</span>
    </button>
  </div>
</nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheet-inner"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept=".json,application/json" style="display:none">

<script>
(function () {
  'use strict';

  /* ================= 基础工具 ================= */
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseYmd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function r1(x) { return Math.round(x * 10) / 10; }
  function r2(x) { return Math.round(x * 100) / 100; }
  function fmtMD(key) { return (+key.slice(5, 7)) + '月' + (+key.slice(8, 10)) + '日'; }
  /* 历史列表用全日期：2026/11/21 */
  function fmtYMD(key) { return key.replace(/-/g, '/'); }
  function isDateKey(v) { return /^\d{4}-\d{2}-\d{2}$/.test(v); }
  function isNum(v) { return v !== undefined && v !== null && v !== '' && isFinite(+v); }
  /* 备份/导入的条数文案 */
  function dataText(nw, nm) { return nw + ' 条体重' + (nm ? '、' + nm + ' 组围度' : ''); }

  var TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
  var TODAY_KEY = ymd(TODAY);
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];

  var METRICS = [
    { key: 'arm', label: '手臂', def: 30 },
    { key: 'chest', label: '胸围', def: 90 },
    { key: 'waist', label: '腰围', def: 80 },
    { key: 'hip', label: '臀围', def: 95 },
    { key: 'thigh', label: '大腿', def: 50 },
    { key: 'calf', label: '小腿', def: 35 }
  ];

  var STORE_KEY = 'weight-calendar-v3';
  var RESET_KEY = 'weight-calendar-reset-v3';
  /* 体重录入范围，一律按公斤校验；换成斤时上下限乘 2 */
  var KG_MIN = 20, KG_MAX = 300;

  /* 全新空白：首次加载时清掉旧版本残留的记录、备份和文件夹授权 */
  try {
    if (!localStorage.getItem(RESET_KEY)) {
      localStorage.removeItem('weight-calendar-v1');
      localStorage.removeItem('weight-calendar-v2');
      localStorage.setItem(RESET_KEY, '1');
      if (window.indexedDB) { try { indexedDB.deleteDatabase('weight-calendar-fs'); } catch (e) {} }
    }
  } catch (e) { /* 忽略 */ }

  /* 弹层顶部：把手 + 标题（可选副标题）+ 关闭按钮（确认弹层可省） */
  function sheetHead(title, sub, noClose) {
    return '<div class="handle"></div>' +
      '<div class="sheet-head"><div>' +
      '<h3 class="sheet-title">' + title + '</h3>' +
      (sub ? '<p class="sheet-sub">' + sub + '</p>' : '') +
      '</div>' + (noClose ? '' : '<button class="close-btn" data-close>' +
      '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>') + '</div>';
  }

  function tri(up) {
    var d = up ? 'M5 1.4 L9.2 8.4 L0.8 8.4 Z' : 'M5 8.6 L0.8 1.6 L9.2 1.6 Z';
    return '<svg class="tri" viewBox="0 0 10 10"><path d="' + d + '"/></svg>';
  }

  function deltaSpan(d, dp, extra, trim, unit) {
    var dec = dp === undefined ? 1 : dp;
    var x = extra || '';
    if (d === null || d === undefined || isNaN(d)) return '<span class="dlt n ' + x + '">—</span>';
    if (Math.abs(d) < 0.005) return '<span class="dlt f ' + x + '">0.0</span>';
    var txt = Math.abs(d).toFixed(trim ? 2 : dec);
    if (trim && txt.charAt(txt.length - 1) === '0') txt = txt.slice(0, -1);
    return '<span class="dlt ' + (d > 0 ? 'u' : 'd') + ' ' + x + '">' + tri(d > 0) + txt +
      (unit ? '<u class="dunit">' + unit + '</u>' : '') + '</span>';
  }

  /* ---------- 体重单位（内部统一按公斤存储） ---------- */
  function unitOf() { return store && store.settings && store.settings.unit === 'jin' ? 'jin' : 'kg'; }
  function unitLabel() { return unitOf() === 'jin' ? '斤' : '公斤'; }
  function toDisp(kg) { return unitOf() === 'jin' ? kg * 2 : kg; }
  function fromDisp(v) { return unitOf() === 'jin' ? v / 2 : v; }
  /* 保留至少 minDec 位小数，多余末尾 0 去掉：85.00→85.0、85.10→85.1、85.25→85.25 */
  function trimNum(s, minDec) {
    var dot = s.indexOf('.');
    if (dot < 0) return s;
    while (s.length - dot - 1 > minDec && s.charAt(s.length - 1) === '0') s = s.slice(0, -1);
    return s;
  }
  function fmtW(kg) {
    var n = +kg;
    if (!isFinite(n)) return '—';
    return unitOf() === 'jin' ? trimNum((n * 2).toFixed(1), 1) : trimNum(n.toFixed(2), 1);
  }
  function wDeltaSpan(d, dec, unit) {
    if (d === null || d === undefined || isNaN(d)) return deltaSpan(null, dec);
    return deltaSpan(toDisp(d), dec, undefined, unitOf() === 'kg', unit ? unitLabel() : '');
  }

  /* ================= 存储 ================= */
  var store;
  var BACKUP_LIMIT = 24;

  function emptyStore() {
    return { weights: {}, measures: {}, backups: [], settings: { unit: 'kg' } };
  }
  function normalizeStore(s) {
    if (!s || typeof s !== 'object' || !s.weights || !s.measures) return emptyStore();
    s.backups = Array.isArray(s.backups) ? s.backups.filter(function (b) {
      return b && typeof b === 'object' && b.at;
    }) : [];
    s.settings = Object.assign({ unit: 'kg' }, s.settings || {});
    return s;
  }
  function persist() {
    idxCache = null;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* 忽略：file:// 下可能不可用 */ }
  }
  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.weights && s.measures) return normalizeStore(s);
      }
    } catch (e) { /* 忽略 */ }
    return emptyStore();
  }

  /* ================= 状态 ================= */
  var ui = {
    y: TODAY.getFullYear(),
    m: TODAY.getMonth(),
    sel: TODAY_KEY,
    metric: 'waist',
    sheetDate: TODAY_KEY,
    sheetBlank: false
  };

  /* 日历回到今天所在月份、并选中今天 */
  function focusToday() {
    ui.y = TODAY.getFullYear();
    ui.m = TODAY.getMonth();
    ui.sel = TODAY_KEY;
  }

  var calendarEl = document.getElementById('calendar');
  var monthTitle = document.getElementById('month-title');
  var summaryEl = document.getElementById('summary');
  var pageW = document.getElementById('page-weight');
  var pageCal = document.getElementById('page-calendar');
  var pageMea = document.getElementById('page-measure');
  var pageBk = document.getElementById('page-backup');
  var wListEl = document.getElementById('w-list');
  var clearWeightEl = document.getElementById('clear-weight');
  var headWEl = document.getElementById('head-weight');
  var headBmiEl = document.getElementById('head-bmi');
  var goalLineEl = document.getElementById('goal-line');
  var mselectEl = document.getElementById('mselect');
  var heroTop = document.getElementById('hero-top');
  var histList = document.getElementById('hist-list');
  var histCount = document.getElementById('hist-count');
  var clearAllEl = document.getElementById('clear-all');
  var overlayEl = document.getElementById('overlay');
  var sheetEl = document.getElementById('sheet');
  var sheetInner = document.getElementById('sheet-inner');
  var bkListEl = document.getElementById('bk-list');
  var bkCountEl = document.getElementById('bk-count');
  var bkRemindEl = document.getElementById('bk-remind');
  var bkDotEl = document.getElementById('bk-dot');
  var tabAddEl = document.getElementById('tab-add');
  var fileInputEl = document.getElementById('file-input');
  var helpTipEl = document.getElementById('help-tip');
  var toastEl = document.getElementById('toast');

  /* ================= 体重索引 ================= */
  var idxCache = null;   /* 每次落库后失效，同一次渲染只扫一遍 */
  function indexWeights() {
    if (idxCache) return idxCache;
    var keys = Object.keys(store.weights).sort();
    var deltas = {};
    keys.forEach(function (k, i) {
      deltas[k] = i === 0 ? null : r2(store.weights[k] - store.weights[keys[i - 1]]);
    });
    idxCache = { keys: keys, deltas: deltas };
    return idxCache;
  }

  /* ================= 日历 ================= */
  function renderCalendar() {
    var y = ui.y, m = ui.m;
    monthTitle.textContent = y + '年' + (m + 1) + '月';

    var idx = indexWeights();
    var first = new Date(y, m, 1);
    var offset = (first.getDay() + 6) % 7;
    var days = new Date(y, m + 1, 0).getDate();
    var total = Math.ceil((offset + days) / 7) * 7;
    var html = '';

    for (var i = 0; i < total; i++) {
      var d = new Date(y, m, 1 - offset + i);
      var key = ymd(d);
      var inMonth = d.getMonth() === m;
      var w = store.weights[key];
      var cls = 'day';
      if (!inMonth) cls += ' ghost';
      if (key === ui.sel) cls += ' sel';
      if (key === TODAY_KEY) cls += ' today';

      var parts = '<span class="dnum">' + d.getDate() + '</span>';
      if (w !== undefined) parts += '<span class="dwt">' + fmtW(w) + '</span>';
      if (inMonth && w !== undefined) parts += wDeltaSpan(idx.deltas[key]);
      html += '<button class="' + cls + '" data-date="' + key + '">' + parts + '</button>';
    }
    calendarEl.innerHTML = html;
  }

  /* ================= 顶部：最近体重 + BMI ================= */
  function latestWeight() {
    var keys = indexWeights().keys;
    if (!keys.length) return null;
    var k = keys[keys.length - 1];
    return { date: k, kg: store.weights[k] };
  }
  function heightCm() {
    var h = +store.settings.height;
    return isFinite(h) && h > 0 ? h : 0;
  }
  function bmiOf(kg, h) { return kg / Math.pow(h / 100, 2); }

  function renderHead() {
    var lw = latestWeight();
    headWEl.innerHTML = lw
      ? '<span>' + fmtW(lw.kg) + '</span><span class="head-u">' + unitLabel() + '</span>'
      : '<span class="head-u" style="font-size:13px">还没有记录</span>';
    var h = heightCm();
    if (headBmiEl) headBmiEl.textContent = (lw && h) ? bmiOf(lw.kg, h).toFixed(1) : '—';

    /* 目标体重：距目标还差多少 */
    var goal = +store.settings.goal;
    if (lw && isFinite(goal) && goal > 0) {
      var gap = toDisp(lw.kg - goal);
      var txt = Math.abs(r1(gap)).toFixed(1);
      if (gap > 0.049) {
        goalLineEl.className = 'goal-line up';
        goalLineEl.innerHTML = '距目标 ' + fmtW(goal) + ' ' + unitLabel() + '，还差 <b>' + txt + '</b> ' + unitLabel();
      } else {
        goalLineEl.className = 'goal-line ok';
        goalLineEl.innerHTML = '已达到目标 <b>' + fmtW(goal) + ' ' + unitLabel() + '</b>';
      }
      goalLineEl.hidden = false;
    } else if (lw) {
      goalLineEl.className = 'goal-line';
      goalLineEl.innerHTML = '设定目标体重';
      goalLineEl.hidden = false;
    } else {
      goalLineEl.hidden = true;
      goalLineEl.innerHTML = '';
    }

    renderUnitTog();
  }

  /* 首页单位切换：选中的加粗变深（体围记录弹层里的单位开关各自渲染） */
  function renderUnitTog() {
    var u = unitOf(), items = document.querySelectorAll('.unit-tog [data-unit-set]');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('on', items[i].getAttribute('data-unit-set') === u);
    }
  }

  /* ================= 月度统计 ================= */
  function renderSummary() {
    var idx = indexWeights();
    var prefix = ui.y + '-' + pad(ui.m + 1);
    var keys = idx.keys.filter(function (k) { return k.indexOf(prefix) === 0; });

    var up = 0, down = 0;
    keys.forEach(function (k) {
      var d = idx.deltas[k];
      if (d === null) return;
      if (d > 0.05) up++; else if (d < -0.05) down++;
    });

    var base = null;
    var before = idx.keys.filter(function (k) { return k < prefix + '-01'; });
    if (before.length) base = store.weights[before[before.length - 1]];
    /* 本月只有一条记录时没有可比基准，宁可显示「—」也不显示 0.0 */
    else if (keys.length > 1) base = store.weights[keys[0]];

    var change = (keys.length && base !== null) ? r2(store.weights[keys[keys.length - 1]] - base) : null;
    var avg = (keys.length && change !== null) ? r2(change / keys.length) : null;

    summaryEl.innerHTML =
      '<div class="stat"><div class="k">本月</div><div class="v">' + (change === null ? '<span class="mt">—</span>' : wDeltaSpan(change, 1)) + '</div></div>' +
      '<div class="stat"><div class="k">日均</div><div class="v">' + (avg === null ? '<span class="mt">—</span>' : wDeltaSpan(avg, 2)) + '</div></div>' +
      '<div class="stat"><div class="k">减重</div><div class="v"><span class="num-down">' + down + '</span><span class="unit">天</span></div></div>' +
      '<div class="stat"><div class="k">增重</div><div class="v"><span class="num-up">' + up + '</span><span class="unit">天</span></div></div>';
  }

  /* ================= 体围 ================= */
  function measureDates() { return Object.keys(store.measures).sort(); }

  /* 每个日期、每个部位的「上一次数值」，一次扫完（供历史列表用） */
  function buildPrevMap(dates) {
    var last = {}, map = {};
    dates.forEach(function (k) {
      var rec = store.measures[k], row = {};
      METRICS.forEach(function (m) {
        row[m.key] = last[m.key] === undefined ? null : last[m.key];
        if (isNum(rec[m.key])) last[m.key] = +rec[m.key];
      });
      map[k] = row;
    });
    return map;
  }

  function renderMeasure() {
    var dates = measureDates();
    var latest = {};
    METRICS.forEach(function (m) {
      for (var i = dates.length - 1; i >= 0; i--) {
        var v = store.measures[dates[i]][m.key];
        if (isNum(v)) { latest[m.key] = { value: +v, date: dates[i] }; break; }
      }
    });

    mselectEl.innerHTML = METRICS.map(function (m) {
      var l = latest[m.key];
      return '<button class="mchip ' + (ui.metric === m.key ? 'on' : '') + '" data-metric="' + m.key + '">' +
        '<span class="mk">' + m.label + '</span>' +
        '<span class="mv">' + (l ? l.value.toFixed(1) : '—') + '</span>' +
        '</button>';
    }).join('');

    var ds = dates.filter(function (k) { return isNum(store.measures[k][ui.metric]); });

    if (ds.length === 0) {
      heroTop.innerHTML = '<div class="hero-empty">还没有体围记录<br>双击部位或点底部中间的「+」记一组围度</div>';
    } else {
      var lastKey = ds[ds.length - 1];
      var lastVal = +store.measures[lastKey][ui.metric];
      var prevKey = ds.length > 1 ? ds[ds.length - 2] : null;
      var delta = prevKey ? r1(lastVal - (+store.measures[prevKey][ui.metric])) : null;
      heroTop.innerHTML =
        '<div class="hero-main"><span class="hero-val">' + lastVal.toFixed(1) + '</span><span class="hero-unit">cm</span>' +
        (prevKey ? deltaSpan(delta, 1, 'hero-delta') : '') + '</div>' +
        '<div class="hero-meta">' + (prevKey
          ? '较 ' + fmtYMD(prevKey) + ' 的 ' + (+store.measures[prevKey][ui.metric]).toFixed(1) + ' cm'
          : '第一条记录，之后会显示变化') + '</div>';
    }

    renderHistory(dates);
    clearAllEl.style.display = dates.length ? 'block' : 'none';
  }

  var histOpen = false;
  var HIST_SHOWN = 10;
  var W_SHOWN = 20;   /* 体重页默认显示最近 20 条 */

  function renderHistory(dates) {
    histCount.textContent = dates.length ? dates.length + ' 条' : '';
    if (!dates.length) {
      histList.innerHTML = '<div class="empty-note">记录第一组围度后，这里会按时间列出每一组的变化。</div>';
      return;
    }
    var list = dates.slice().reverse();
    var shown = histOpen ? list : list.slice(0, HIST_SHOWN);
    var prevMap = buildPrevMap(dates);
    histList.innerHTML = shown.map(function (k) {
      var rec = store.measures[k];
      var cells = METRICS.map(function (m) {
        var v = rec[m.key];
        var hasV = isNum(v);
        var pv = hasV ? prevMap[k][m.key] : null;
        var dlt = (hasV && pv !== null) ? r1((+v) - pv) : null;
        return '<div class="mcell">' +
          '<div class="k">' + m.label + '</div>' +
          '<div class="v">' + (hasV ? (+v).toFixed(1) : '—') + '</div>' +
          ((hasV && pv !== null) ? deltaSpan(dlt, 1) : '') +
          '</div>';
      }).join('');
      return '<div class="mrow">' +
        '<div class="mrow-head"><span class="mrow-date">' + fmtYMD(k) + '</span>' +
        '<button class="mrow-del" data-mdel="' + k + '">删除</button>' +
        '<button class="mrow-edit" data-edit="' + k + '">编辑</button></div>' +
        '<div class="mrow-body">' + cells + '</div>' +
        '</div>';
    }).join('') +
      (list.length > HIST_SHOWN
        ? '<button class="more-btn" id="hist-more">' + (histOpen ? '收起' : '展开更多') + '</button>'
        : '');
  }

  /* ================= 弹层 ================= */
  var pendingConfirm = null;   /* 确认弹层的回调 */
  var pendingImport = null;    /* 待落库的导入数据 */

  function openSheet(html) {
    sheetInner.innerHTML = html;
    overlayEl.classList.add('on');
    sheetEl.classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    overlayEl.classList.remove('on');
    sheetEl.classList.remove('on');
    document.body.style.overflow = '';
    pendingConfirm = null;
    pendingImport = null;   /* 弹层一关，没落库的导入数据不留在内存里 */
  }
  function setHint(msg, isErr) {
    var h = sheetInner.querySelector('.sheet-hint');
    if (!h) return;
    h.textContent = msg;
    h.classList.toggle('err', !!isErr);
  }

  var WP_P = 42, WP_N = 15, WP_MID = 7;

  /* 体重的显示单位上下限 */
  function unitLimit() {
    return unitOf() === 'jin' ? { lo: KG_MIN * 2, hi: KG_MAX * 2 } : { lo: KG_MIN, hi: KG_MAX };
  }

  /* 默认展示值：没有历史记录时滚轮的起始位置 */
  function defaultDisp() { return unitOf() === 'jin' ? 120 : 60; }

  function lastWeightEntry(dateKey) {
    var keys = indexWeights().keys;
    var i, best = null;
    for (i = 0; i < keys.length; i++) { if (keys[i] < dateKey) best = keys[i]; }
    if (best) return { date: best, kg: store.weights[best] };
    for (i = 0; i < keys.length; i++) { if (keys[i] > dateKey) return { date: keys[i], kg: store.weights[keys[i]] }; }
    return null;
  }

  function rowText(v) {
    var near = Math.round(v * 10) / 10;
    return Math.abs(v - near) < 0.005 ? near.toFixed(1) : v.toFixed(2);
  }

  function setBigText(v) {
    var el = document.getElementById('wbigv');
    if (el) el.textContent = rowText(v);
    var inp = document.getElementById('winput');
    if (inp && inp.style.display === 'block') inp.value = rowText(v);
  }

  var numCtx = null;

  function clampNum(v) {
    return Math.min(numCtx.max, Math.max(numCtx.min, Math.round(v * 100) / 100));
  }

  function renderWheel() {
    var sc = document.getElementById('wscale');
    if (!sc || !numCtx) return;
    var rows = '', i, val;
    for (i = 0; i < WP_N; i++) {
      val = clampNum(numCtx.val + (i - WP_MID) * numCtx.step);
      rows += '<div class="wrow' + (i === WP_MID ? ' mid' : '') + '">' + rowText(val) + '</div>';
    }
    sc.innerHTML = rows;
    sc.style.transition = 'none';
    sc.style.transform = 'translate3d(0,' + ((2 - WP_MID) * WP_P) + 'px,0)';
    setBigText(numCtx.val);
  }

  function highlightRow(k) {
    var sc = document.getElementById('wscale');
    if (!sc) return;
    var rows = sc.children;
    for (var i = 0; i < rows.length; i++) rows[i].classList.toggle('mid', i === k);
  }

  function bindWheel() {
    var wrap = document.getElementById('wpick');
    var sc = document.getElementById('wscale');
    if (!wrap || !sc || !numCtx) return;
    var startY = 0, dy = 0, dragging = false, baseVal = 0, pid = null;

    function kOf() { return Math.max(0, Math.min(WP_N - 1, WP_MID - Math.round(dy / WP_P))); }
    function valOf(k) { return clampNum(baseVal + (k - WP_MID) * numCtx.step); }

    wrap.addEventListener('pointerdown', function (e) {
      if (e.button) return;
      dragging = true; dy = 0; startY = e.clientY; pid = e.pointerId; baseVal = numCtx.val;
      sc.style.transition = 'none';
      try { wrap.setPointerCapture(pid); } catch (err) {}
    });

    wrap.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dy = e.clientY - startY;
      var k = kOf();
      sc.style.transform = 'translate3d(0,' + ((2 - WP_MID) * WP_P + dy) + 'px,0)';
      setBigText(valOf(k));
      highlightRow(k);
      e.preventDefault();
    });

    function end() {
      if (!dragging) return;
      dragging = false;
      var k = kOf();
      numCtx.val = valOf(k);
      sc.style.transition = 'transform .2s cubic-bezier(.22,1,.36,1)';
      sc.style.transform = 'translate3d(0,' + ((2 - k) * WP_P) + 'px,0)';
      highlightRow(k);
      setTimeout(function () { if (!dragging) renderWheel(); }, 220);
    }
    wrap.addEventListener('pointerup', end);
    wrap.addEventListener('pointercancel', end);
  }

  function bindBigInput() {
    var big = document.getElementById('wbig');
    var inp = document.getElementById('winput');
    if (big) big.addEventListener('click', function (e) {
      if (e.target.closest('.wunits')) return; /* 点单位不进入输入态 */
      big.style.display = 'none';
      inp.style.display = 'block';
      inp.value = rowText(numCtx.val);
      inp.focus();
      try { inp.select(); } catch (e) {}
    });
    if (inp) {
      inp.addEventListener('blur', commitWInput);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
    }
  }

  function commitWInput() {
    var input = document.getElementById('winput');
    var big = document.getElementById('wbig');
    if (!input || input.style.display === 'none' || !numCtx) return;
    var t = parseFloat(input.value);
    if (isFinite(t)) numCtx.val = clampNum(t);
    input.style.display = 'none';
    if (big) big.style.display = 'flex';
    renderWheel();
  }

  function openNumSheet(cfg) {
    numCtx = cfg;
    numCtx.step = cfg.step || 0.1;
    numCtx.val = clampNum(cfg.val);
    openSheet(
      sheetHead(cfg.title, cfg.sub) +
      (cfg.pick ? '<div class="datepill">' +
        '<input type="date" id="num-date" value="' + ui.sheetDate + '"></div>' : '') +
      '<div class="wbig" id="wbig">' +
        '<span class="v" id="wbigv">' + rowText(numCtx.val) + '</span>' +
        (cfg.kind === 'weight'
          ? ('<span class="wunits">' +
            '<span class="wunit' + (unitOf() === 'jin' ? ' on' : '') + '" data-unit-set="jin">斤</span>' +
            '<span class="wsep">/</span>' +
            '<span class="wunit' + (unitOf() === 'kg' ? ' on' : '') + '" data-unit-set="kg">公斤</span>' +
            '</span>')
          : '<span class="u">' + cfg.unit + '</span>') +
      '</div>' +
      '<input class="winput" id="winput" type="number" inputmode="decimal" step="' + numCtx.step + '" min="' + cfg.min + '" max="' + cfg.max + '">' +
      (cfg.note ? '<p class="wsrc">' + cfg.note + '</p>' : '') +
      '<div class="wpick" id="wpick"><div class="wpick-band"></div><div class="wscale" id="wscale"></div></div>' +
      '<p class="sheet-hint"></p>' +
      '<button class="btn-primary tall" id="num-save">保存</button>' +
      (cfg.extra || '')
    );
    renderWheel();
    bindWheel();
    bindBigInput();
    var dEl = document.getElementById('num-date');
    if (dEl) dEl.addEventListener('change', function () {
      var v = dEl.value;
      if (!isDateKey(v)) return;
      if (numCtx.kind === 'metric') openMetricSheet(numCtx.metric, v, numCtx.val);
      else openWeightSheet(v, numCtx.val, true);
    });
  }

  /* sameDate：切单位重开同一天时，用弹层里刚调好的值，别退回已存记录 */
  function openWeightSheet(dateKey, startDisp, pick, sameDate) {
    ui.sheetDate = dateKey;
    var d = parseYmd(dateKey);
    var has = store.weights[dateKey] !== undefined;
    var val;
    /* 已存记录按真实值取（不要用显示格式化的 1 位小数，否则打开再保存会改写原值） */
    if (has && !sameDate) {
      val = toDisp(store.weights[dateKey]);
    } else if (typeof startDisp === 'number' && isFinite(startDisp)) {
      val = startDisp;
    } else {
      var ref = lastWeightEntry(dateKey);
      val = ref ? toDisp(ref.kg) : defaultDisp();
    }
    openNumSheet({
      kind: 'weight',
      title: '记录体重',
      sub: pick ? '' : fmtMD(dateKey) + ' · 周' + WEEK[d.getDay()],
      pick: !!pick,
      min: unitLimit().lo, max: unitLimit().hi,
      val: val
    });
  }

  function saveWeight() {
    /* 输入值在滚轮/输入框里已按上下限 clamp，这里直接落库 */
    var kg = r2(fromDisp(numCtx.val));
    store.weights[ui.sheetDate] = kg;
    persist();
    var d = parseYmd(ui.sheetDate);
    ui.y = d.getFullYear(); ui.m = d.getMonth(); ui.sel = ui.sheetDate;
    closeSheet();
    renderAll();
  }

  /* ---------- 体重页：按月分组的记录列表 ---------- */
  var wOpen = false;            /* 是否已展开全部记录 */

  function renderWeight() {
    var idx = indexWeights();
    var all = idx.keys.slice().reverse();   /* 最新的在最上面 */

    if (!all.length) {
      wListEl.innerHTML = '<div class="empty-note w-empty">还没有体重记录<br>点底部中间的「+」记第一笔</div>';
      clearWeightEl.style.display = 'none';
      return;
    }
    clearWeightEl.style.display = 'block';

    var keys = wOpen ? all : all.slice(0, W_SHOWN);

    /* 每月天数与当月总差值：按全部记录（时间正序）统计，折叠时数字也不变 */
    var mstat = {}, prevKg = null;
    idx.keys.forEach(function (k) {
      var ym = k.slice(0, 7), kg = store.weights[k];
      var m = mstat[ym] || (mstat[ym] = { n: 0, first: kg, base: prevKg });
      m.n++; m.last = kg;
      prevKg = kg;
    });

    var html = '', cur = '';
    keys.forEach(function (k) {
      var ym = k.slice(0, 7), d = parseYmd(k);
      if (ym !== cur) {
        if (cur) html += '</div>';
        var m = mstat[ym];
        var base = m.base !== null ? m.base : (m.n > 1 ? m.first : null);
        var chg = base === null ? null : m.last - base;
        html += '<div class="wgroup"><div class="wgroup-head">' +
          '<span class="t">' + d.getFullYear() + '年' + (d.getMonth() + 1) + '月</span>' +
          '<span class="n">' + m.n + ' 天' +
          (chg === null ? '' : wDeltaSpan(chg, undefined, true)) + '</span></div>';
        cur = ym;
      }
      var dl = idx.deltas[k];
      html += '<div class="wrowitem">' +
        '<div class="wri-d"><b>' + (+k.slice(8, 10)) + '</b><i>周' + WEEK[d.getDay()] + '</i></div>' +
        '<div class="wri-w" data-wedit="' + k + '">' + fmtW(store.weights[k]) + '<u>' + unitLabel() + '</u></div>' +
        '<div class="wri-dt">' + (dl == null ? '' : wDeltaSpan(dl)) + '</div>' +
        '<button class="wri-del" data-wdelkey="' + k + '">删除</button>' +
        '</div>';
    });
    wListEl.innerHTML = html + '</div>' + (all.length > W_SHOWN
      ? '<button class="more-btn" id="w-more">' + (wOpen ? '收起' : '展开更多') + '</button>'
      : '');
  }

  function removeWeight(key) {
    delete store.weights[key];
    persist();
    renderAll();
    toast('已删除 ' + fmtYMD(key) + ' 的体重记录');
  }

  /* 清空全部体重记录（体围、备份不受影响） */
  function openClearWeight() {
    askConfirm({
      title: '确认清空体重记录？',
      ok: '清空',
      onOk: function () {
        store.weights = {};
        persist();
        focusToday();
        renderAll();
        toast('已清空体重记录');
      }
    });
  }

  /* 删除单日体重：体重页的「删除」和日历长按都走这里 */
  function deleteWeightAt(key) {
    askConfirm({
      title: '删除 ' + fmtYMD(key) + ' 的体重？',
      ok: '删除',
      onOk: function () { removeWeight(key); }
    });
  }

  function openMetricSheet(metricKey, dateKey, startDisp) {
    var key = dateKey || TODAY_KEY;
    var m = METRICS.filter(function (x) { return x.key === metricKey; })[0];
    if (!m) return;
    ui.sheetDate = key;
    var rec = store.measures[key] || {};
    var has = isNum(rec[metricKey]);
    var cur = has ? +rec[metricKey] : null;
    var note = '';
    if (!has) {
      if (typeof startDisp === 'number' && isFinite(startDisp)) {
        cur = startDisp;
      } else {
        var prev = lastMetricEntry(metricKey, key);
        if (prev) {
          cur = prev.value;
          note = '已沿用 ' + fmtYMD(prev.date) + ' 的 ' + prev.value.toFixed(1) + ' cm';
        }
      }
    }
    openNumSheet({
      kind: 'metric',
      metric: metricKey,
      title: '记录' + m.label,
      sub: '',
      pick: true,
      unit: 'cm',
      min: 10, max: 300,
      val: cur === null ? m.def : cur,
      note: note,
      extra: has ? '<button class="btn-danger" id="m-del-one">清除这项记录</button>' : ''
    });
  }

  function lastMetricEntry(metricKey, dateKey) {
    var dates = measureDates();
    var i, best = null;
    for (i = 0; i < dates.length; i++) {
      if (dates[i] < dateKey && isNum(store.measures[dates[i]][metricKey])) best = dates[i];
    }
    if (best) return { date: best, value: +store.measures[best][metricKey] };
    for (i = dates.length - 1; i >= 0; i--) {
      if (isNum(store.measures[dates[i]][metricKey])) return { date: dates[i], value: +store.measures[dates[i]][metricKey] };
    }
    return null;
  }

  function saveMetricValue() {
    var key = ui.sheetDate, rec = store.measures[key] || {};
    rec[numCtx.metric] = r1(clampNum(numCtx.val));
    store.measures[key] = rec;
    endMetric();
  }

  function deleteMetricValue() {
    var key = ui.sheetDate, rec = store.measures[key];
    if (rec) {
      delete rec[numCtx.metric];
      if (!Object.keys(rec).length) delete store.measures[key];
    }
    endMetric();
  }

  /* 单项围度保存或清除后：记住当前部位，回到体围页 */
  function endMetric() {
    persist();
    ui.metric = numCtx.metric;
    closeSheet();
    renderMeasure();
  }

  /* 体围历史：删掉整整一天的那组围度 */
  function deleteMeasureAt(key) {
    askConfirm({
      title: '删除 ' + fmtYMD(key) + ' 的体围记录？',
      sub: '这一天的各项围度会一起删除',
      ok: '删除',
      onOk: function () {
        delete store.measures[key];
        persist();
        renderMeasure();
        toast('已删除 ' + fmtYMD(key) + ' 的体围记录');
      }
    });
  }

  /* ---------- 身高 / 体重 → BMI ---------- */
  var bmiPrefill = null;

  function openBmiSheet() {
    var lw = latestWeight();
    var h = heightCm();
    /* 没有任何体重记录时留空，别拿一个假数字顶在输入框里 */
    var wDisp = lw ? fmtW(lw.kg) : '';
    bmiPrefill = lw ? parseFloat(wDisp) : null;
    openSheet(
      sheetHead('身高与体重', '改身高或体重，BMI 会一起更新') +
      '<div class="mform">' +
      '<div class="frow"><span class="flabel">身高</span>' +
      '<input class="finput" id="bmi-h" type="number" inputmode="decimal" step="0.5" placeholder="0" value="' + (h ? h : '') + '">' +
      '<span class="funit" style="width:26px">cm</span></div>' +
      '<div class="frow"><span class="flabel">体重</span>' +
      '<input class="finput" id="bmi-w" type="number" inputmode="decimal" step="0.1" placeholder="—" value="' + wDisp + '">' +
      '<span class="funit" style="width:26px">' + unitLabel() + '</span></div>' +
      '</div>' +
      '<p class="sheet-hint"></p>' +
      '<button class="btn-primary tall" id="bmi-save">保存</button>'
    );
    var ih = document.getElementById('bmi-h');
    if (ih && !h) setTimeout(function () { try { ih.focus(); } catch (e) {} }, 260);
  }

  function saveBmi() {
    var hv = parseFloat(document.getElementById('bmi-h').value);
    var rawW = document.getElementById('bmi-w').value.trim();
    var wv = rawW === '' ? null : parseFloat(rawW);
    if (!isFinite(hv) || hv < 100 || hv > 250) { setHint('身高请输入 100–250 cm', true); return; }
    var lim = unitLimit();
    if (wv !== null && (!isFinite(wv) || wv < lim.lo || wv > lim.hi)) {
      setHint('体重请输入 ' + lim.lo + '–' + lim.hi + ' ' + unitLabel(), true); return;
    }
    store.settings.height = r1(hv);
    if (wv !== null) {
      var kg = r2(fromDisp(wv));
      /* 只有今天确实称过（已有记录），或这次改了体重，才落到今天的记录上 */
      var hasToday = store.weights[TODAY_KEY] !== undefined;
      var changed = bmiPrefill === null || Math.abs(wv - bmiPrefill) > 0.049;
      if (hasToday || changed) store.weights[TODAY_KEY] = kg;
    }
    persist();
    focusToday();
    closeSheet();
    renderAll();
    var lw = latestWeight();
    toast(lw ? 'BMI ' + bmiOf(lw.kg, hv).toFixed(1) : '身高已保存');
  }

  /* 点「斤 / 公斤」：首页只换显示单位；只有体重弹层开着时才换算并保留数值 */
  function switchUnitTo(u) {
    u = u === 'jin' ? 'jin' : 'kg';
    if (u === unitOf()) return;
    var inSheet = sheetEl.classList.contains('on') && numCtx && numCtx.kind === 'weight';
    var keepKg = inSheet ? fromDisp(numCtx.val) : null;   /* 换单位前先按旧单位折算成公斤 */
    var pick = inSheet && !!numCtx.pick;
    store.settings.unit = u;
    persist();
    renderAll();
    if (keepKg !== null) openWeightSheet(ui.sheetDate, toDisp(keepKg), pick, true);
  }

  /* ---------- 目标体重（点日历页目标行打开） ---------- */
  function openGoalSheet() {
    var g = +store.settings.goal;
    var has = isFinite(g) && g > 0;
    var lw = latestWeight();
    var val = has ? fmtW(g) : (lw ? fmtW(lw.kg) : defaultDisp());
    openSheet(
      sheetHead('目标体重') +
      '<div class="mform">' +
      '<div class="frow"><span class="flabel">目标</span>' +
      '<input class="finput" id="goal-v" type="number" inputmode="decimal" step="0.1" value="' + val + '">' +
      '<span class="funit" style="width:26px">' + unitLabel() + '</span></div>' +
      '</div>' +
      '<p class="sheet-hint"></p>' +
      '<button class="btn-primary tall" id="goal-save">保存</button>' +
      (has ? '<button class="btn-danger" id="goal-clear">清除目标</button>' : '')
    );
    var gi = document.getElementById('goal-v');
    if (gi) setTimeout(function () { try { gi.focus(); gi.select(); } catch (e) {} }, 260);
  }

  function saveGoal() {
    var gi = document.getElementById('goal-v');
    var v = parseFloat(gi ? gi.value : '');
    var lim = unitLimit();
    if (!isFinite(v) || v < lim.lo || v > lim.hi) {
      setHint('请输入 ' + lim.lo + '–' + lim.hi + ' ' + unitLabel(), true); return;
    }
    store.settings.goal = r2(fromDisp(v));
    persist();
    closeSheet();
    renderHead();
  }

  function clearGoal() {
    store.settings.goal = null;
    persist();
    closeSheet();
    renderHead();
  }

  /* blank=true：从右上角「+ 记录」进来，六项全空，不预填任何已有数据 */
  function openMeasureSheet(dateKey, focusKey, prefill, blank) {
    ui.sheetDate = dateKey;
    ui.sheetBlank = !!blank;
    var rec = prefill || (blank ? {} : (store.measures[dateKey] || {}));
    openSheet(
      sheetHead('记录体围') +
      '<div class="datepill"><input type="date" id="m-date" value="' + dateKey + '"></div>' +
      '<div class="mform">' +
      METRICS.map(function (m) {
        var v = rec[m.key];
        return '<div class="frow"><span class="flabel">' + m.label + '</span>' +
          '<input class="finput" data-key="' + m.key + '" type="number" inputmode="decimal" step="0.1" min="10" max="300" placeholder="—" value="' +
          (isNum(v) ? (+v).toFixed(1) : '') + '">' +
          '<span class="funit">cm</span></div>';
      }).join('') +
      '</div>' +
      '<p class="sheet-hint"></p>' +
      '<button class="btn-primary" id="m-save">保存</button>'
    );
    var dEl = document.getElementById('m-date');
    if (dEl) dEl.addEventListener('change', function () {
      var v = dEl.value;
      if (!isDateKey(v) || v === ui.sheetDate) return;
      var typed = {};
      /* 只把用户真填过的值带到新日期，别把原日期预填的数字一起搬过去 */
      METRICS.forEach(function (m) {
        var inp = sheetInner.querySelector('.finput[data-key="' + m.key + '"]');
        if (!inp) return;
        var raw = inp.value.trim();
        if (raw === '' || !isFinite(parseFloat(raw))) return;
        var was = isNum(rec[m.key]) ? (+rec[m.key]).toFixed(1) : '';
        if ((+parseFloat(raw)).toFixed(1) !== was) typed[m.key] = r1(parseFloat(raw));
      });
      openMeasureSheet(v, null, (!blank && store.measures[v]) ? store.measures[v] : typed, blank);
    });
    if (focusKey) {
      setTimeout(function () {
        var inp = sheetInner.querySelector('.finput[data-key="' + focusKey + '"]');
        if (inp) { try { inp.focus(); inp.select(); } catch (e) {} }
      }, 380);
    }
  }

  function saveMeasure() {
    var dateInput = document.getElementById('m-date');
    var target = dateInput.value;
    if (!isDateKey(target)) { setHint('请选择日期', true); return; }

    var rec = {}, any = false, badLabel = '';
    METRICS.forEach(function (m) {
      if (badLabel) return;
      var inp = sheetInner.querySelector('.finput[data-key="' + m.key + '"]');
      var raw = inp.value.trim();
      if (raw === '') return;
      var v = parseFloat(raw);
      if (!isFinite(v) || v < 10 || v > 300) { badLabel = m.label; return; }
      rec[m.key] = r1(v); any = true;
    });
    if (badLabel) { setHint(badLabel + ' 请在 10–300 cm 之间', true); return; }
    if (!any) { setHint('至少填写一项围度', true); return; }

    /* 从「+ 记录」进来的空白表单：只覆盖这次填的项，没填的保持原值 */
    store.measures[target] = ui.sheetBlank
      ? Object.assign({}, store.measures[target] || {}, rec)
      : rec;
    persist();
    closeSheet();
    renderMeasure();
  }

  /* ================= 备份 ================= */
  function hasData() { return Object.keys(store.weights).length > 0 || Object.keys(store.measures).length > 0; }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 2400);
  }

  /* 生成一份快照（深拷贝，先不入列表；存成文件成功后才入） */
  function newBackup() {
    if (!hasData()) return null;
    return {
      id: 'b' + Date.now() + Math.floor(Math.random() * 1000),
      at: new Date().toISOString(),
      weights: JSON.parse(JSON.stringify(store.weights)),
      measures: JSON.parse(JSON.stringify(store.measures))
    };
  }

  function commitBackup(rec) {
    if (!rec) return;
    store.backups.unshift(rec);
    while (store.backups.length > BACKUP_LIMIT) store.backups.pop();
  }

  function timeLabel(iso) {
    var d = new Date(iso);
    return fmtMD(ymd(d)) + ' 周' + WEEK[d.getDay()] +
      ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  var SAVE_GAP_DAYS = 15;

  /* 距上次「备份到手机本地」过了多少天；从没存过返回 null */
  function daysSinceSave() {
    var t = store.settings.savedAt ? new Date(store.settings.savedAt) : null;
    if (!t || isNaN(t.getTime())) return null;
    return Math.floor((Date.now() - t.getTime()) / 86400000);
  }

  function renderRemind() {
    var d = daysSinceSave();
    var need = hasData() && (d === null || d >= SAVE_GAP_DAYS);
    if (need) {
      bkRemindEl.textContent = d === null
        ? '还没有备份到手机本地，建议现在存一份。'
        : '已 ' + d + ' 天未备份到手机本地，建议现在存一份。';
    }
    bkRemindEl.hidden = !need;
    bkDotEl.hidden = !need;
  }

  function markSaved() {
    store.settings.savedAt = new Date().toISOString();
    persist();
    renderRemind();
  }

  function renderBackup() {
    renderRemind();
    var list = store.backups.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    bkCountEl.textContent = list.length ? list.length + ' 份' : '';

    if (!list.length) {
      bkListEl.innerHTML = '';
      return;
    }
    bkListEl.innerHTML = list.map(function (b) {
      return '<div class="bitem">' +
        '<div class="bitem-l">' +
        '<div class="bitem-time">' + timeLabel(b.at) + '</div>' +
        '<div class="bitem-meta">体重 ' + Object.keys(b.weights || {}).length +
        ' 条 · 围度 ' + Object.keys(b.measures || {}).length + ' 组</div>' +
        '</div>' +
        '<div class="bitem-acts">' +
        '<button data-restore="' + b.id + '">恢复</button>' +
        '<button class="del" data-delbk="' + b.id + '">删除</button>' +
        '</div></div>';
    }).join('');
  }

  function restoreBackup(id) {
    var b = null;
    store.backups.forEach(function (x) { if (x.id === id) b = x; });
    if (!b) return;
    askConfirm({
      title: '恢复这份备份？',
      sub: timeLabel(b.at) + ' · 当前记录会先自动存一份备份',
      ok: '恢复',
      onOk: function () {
        commitBackup(newBackup());
        store.weights = JSON.parse(JSON.stringify(b.weights || {}));
        store.measures = JSON.parse(JSON.stringify(b.measures || {}));
        persist();
        focusToday();
        renderAll();
        switchPage('calendar');
        toast('已恢复到 ' + timeLabel(b.at) + ' 的备份');
      }
    });
  }

  function deleteBackup(id) {
    askConfirm({
      title: '删除这份备份？',
      ok: '删除',
      onOk: function () {
        store.backups = store.backups.filter(function (x) { return x.id !== id; });
        persist();
        renderBackup();
        toast('已删除备份');
      }
    });
  }

  /* ---------- 确认弹层（统一样式） ---------- */
  function askConfirm(o) {
    pendingConfirm = o;
    openSheet(
      sheetHead(o.title, o.sub, true) +
      '<div class="confirm-acts">' +
      '<button class="btn-soft" data-confirm-cancel>取消</button>' +
      '<button class="btn-primary half" data-confirm-ok>' + (o.ok || '确认') + '</button>' +
      '</div>'
    );
  }
  function confirmOk() {
    var p = pendingConfirm;
    pendingConfirm = null;
    closeSheet();
    if (p && p.onOk) p.onOk();
  }
  function confirmCancel() {
    closeSheet();
  }

  /* ---------- 备份页：重置数据（保留备份记录） ---------- */
  function openResetSheet() {
    askConfirm({
      title: '确认重置？',
      sub: '体重与体围记录会被清空，备份记录保留。',
      ok: '确认重置',
      onOk: function () {
        store.weights = {};
        store.measures = {};
        persist();
        focusToday();
        ui.metric = 'waist';
        renderAll();
        switchPage('calendar');
        toast('已重置，备份记录保留');
      }
    });
  }

  /* ---------- 体围页：清空体围记录 ---------- */
  function openClearMeasure() {
    askConfirm({
      title: '确认清空体围记录？',
      ok: '清空',
      onOk: function () {
        store.measures = {};
        persist();
        renderMeasure();
        toast('已清空体围记录');
      }
    });
  }

  /* ---------- 备份文件 ---------- */

  /* 每份备份一个文件，文件名带时间（到毫秒，避免同秒互相覆盖） */
  function fileNameOf(at) {
    var d = new Date(at);
    return '体重日历备份-' + ymd(d) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) +
      ('00' + d.getMilliseconds()).slice(-3) + '.json';
  }

  function fileTextOf(data) {
    return JSON.stringify({
      app: 'weight-calendar', version: 2, unit: 'kg',
      exportedAt: data.at || new Date().toISOString(),
      weights: data.weights || {}, measures: data.measures || {}
    }, null, 2);
  }

  function flashDownload(text, name) {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1200);
  }

  /* 让用户选保存位置；不支持时返回 null */
  function saveViaPicker(text, name) {
    if (!window.showSaveFilePicker) return null;
    return window.showSaveFilePicker({
      suggestedName: name,
      id: 'weight-backup',
      types: [{ description: 'JSON 备份', accept: { 'application/json': ['.json'] } }]
    }).then(function (h) { return h.createWritable(); })
      .then(function (w) { return w.write(text).then(function () { return w.close(); }); });
  }

  /* 把一份快照存成手机上的文件；存成功了才写入备份记录 */
  function saveSnapshot(rec) {
    if (!rec) return;
    var text = fileTextOf(rec), name = fileNameOf(rec.at);
    function done(msg) {
      commitBackup(rec);
      persist();
      renderBackup();
      markSaved();
      toast(msg);
    }
    function fallback() {
      flashDownload(text, name);
      done('已备份到手机下载文件夹');
    }
    var p = null;
    try { p = saveViaPicker(text, name); } catch (e) { p = null; }
    if (!p) { fallback(); return; }
    p.then(function () { done('已存到所选位置'); })
      .catch(function (err) {
        if (err && err.name === 'AbortError') { toast('未选择保存位置，这次没有备份'); return; }
        fallback();
      });
  }

  function importText(text) {
    var data;
    try { data = JSON.parse(text); } catch (e) { toast('文件不是有效的备份'); return; }

    var rawW = data && data.weights, rawM = data && data.measures;
    if ((!rawW || typeof rawW !== 'object') && (!rawM || typeof rawM !== 'object')) {
      toast('文件里没有找到体重或体围记录'); return;
    }

    var cleanW = {}, cleanM = {}, nw = 0, nm = 0;
    if (rawW && typeof rawW === 'object') {
      Object.keys(rawW).forEach(function (k) {
        var v = +rawW[k];
        if (isDateKey(k) && isFinite(v) && v >= KG_MIN && v <= KG_MAX) {
          cleanW[k] = r2(v); nw++;
        }
      });
    }
    if (rawM && typeof rawM === 'object') {
      Object.keys(rawM).forEach(function (k) {
        var rec = rawM[k];
        if (!isDateKey(k) || !rec || typeof rec !== 'object') return;
        var clean = {};
        METRICS.forEach(function (m) {
          var v = +rec[m.key];
          if (rec[m.key] !== undefined && rec[m.key] !== null && rec[m.key] !== '' && isFinite(v) && v >= 10 && v <= 300) {
            clean[m.key] = r1(v);
          }
        });
        if (Object.keys(clean).length) { cleanM[k] = clean; nm++; }
      });
    }
    if (!nw && !nm) { toast('文件里没有可导入的记录'); return; }

    pendingImport = { w: cleanW, m: cleanM, nw: nw, nm: nm };
    openSheet(
      sheetHead('导入数据', '文件里有 ' + dataText(nw, nm)) +
      '<div class="imp-acts">' +
      '<button class="btn-primary" id="imp-merge">合并到现有记录</button>' +
      '<button class="btn-soft" id="imp-replace">整体覆盖</button>' +
      '<button class="imp-cancel" data-close>取消</button>' +
      '</div>'
    );
  }

  function applyImport(mode) {
    var pi = pendingImport;
    if (!pi) return;
    pendingImport = null;
    closeSheet();
    commitBackup(newBackup());
    var addW = 0, addM = 0;

    if (mode === 'replace') {
      store.weights = {};
      store.measures = {};
      Object.keys(pi.w).forEach(function (k) { store.weights[k] = pi.w[k]; });
      Object.keys(pi.m).forEach(function (k) { store.measures[k] = Object.assign({}, pi.m[k]); });
      addW = pi.nw; addM = pi.nm;
    } else {
      /* 合并：只补本机缺的，同一天/同一项已有数值不覆盖 */
      Object.keys(pi.w).forEach(function (k) {
        if (store.weights[k] === undefined) { store.weights[k] = pi.w[k]; addW++; }
      });
      Object.keys(pi.m).forEach(function (k) {
        var merged = Object.assign({}, store.measures[k] || {});
        var got = false;
        Object.keys(pi.m[k]).forEach(function (mk) {
          if (!isNum(merged[mk])) { merged[mk] = pi.m[k][mk]; got = true; }
        });
        if (got) { store.measures[k] = merged; addM++; }
      });
    }

    persist();
    focusToday();
    renderAll();
    switchPage('calendar');

    if (mode === 'replace') {
      toast('已覆盖导入 ' + dataText(pi.nw, pi.nm));
    } else {
      toast(addW || addM ? '已合并 ' + dataText(addW, addM) : '没有可新增的记录，本机已有的保持不变');
    }
  }

  /* ================= 页面切换 / 总渲染 ================= */
  function renderAll() {
    renderCalendar();
    renderHead();
    renderSummary();
    renderWeight();
    renderMeasure();
    renderBackup();
  }

  var curPage = 'calendar';

  function switchPage(p) {
    curPage = p;
    [[pageW, 'weight'], [pageCal, 'calendar'], [pageMea, 'measure'], [pageBk, 'backup']]
      .forEach(function (x) { x[0].hidden = p !== x[1]; });
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('on', t.getAttribute('data-tab') === p);
    });
    /* 备份页没有可记录的数据，「+」收起，四个页签重新均分 */
    var noAdd = p === 'backup';
    tabAddEl.hidden = noAdd;
    tabAddEl.parentNode.classList.toggle('no-add', noAdd);
  }

  /* 日历视图重绘：换月、回今天都走这里 */
  function renderCalView() {
    renderCalendar();
    renderHead();
    renderSummary();
  }

  function shiftMonth(n) {
    var d = new Date(ui.y, ui.m + n, 1);
    ui.y = d.getFullYear();
    ui.m = d.getMonth();
    var selD = parseYmd(ui.sel);
    if (selD.getFullYear() !== ui.y || selD.getMonth() !== ui.m) {
      ui.sel = (TODAY.getFullYear() === ui.y && TODAY.getMonth() === ui.m) ? TODAY_KEY : ymd(new Date(ui.y, ui.m, 1));
    }
    renderCalView();
  }

  /* ================= 事件 ================= */
  var lastDayTap = { key: null, at: 0 };
  var lastChipTap = { key: null, at: 0 };

  /* ---------- 长按日期 → 确认后删掉当天的体重记录 ---------- */
  var lpTimer = null, lpFrom = null, lpMoved = false, lpDoneAt = 0;

  document.addEventListener('pointerdown', function (e) {
    var day = e.target.closest ? e.target.closest('.day') : null;
    if (!day) return;
    var key = day.getAttribute('data-date');
    lpMoved = false;
    lpFrom = { x: e.clientX, y: e.clientY };
    clearTimeout(lpTimer);
    lpTimer = setTimeout(function () {
      lpTimer = null;
      if (lpMoved) return;
      lpDoneAt = Date.now();
      if (store.weights[key] === undefined) { toast('这天没有体重记录'); return; }
      ui.sel = key;
      renderCalendar();
      deleteWeightAt(key);
    }, 520);
  });

  document.addEventListener('pointermove', function (e) {
    if (!lpFrom) return;
    if (Math.abs(e.clientX - lpFrom.x) > 10 || Math.abs(e.clientY - lpFrom.y) > 10) {
      lpMoved = true;
      clearTimeout(lpTimer);
      lpTimer = null;
    }
  }, { passive: true });

  function lpCancel() {
    lpFrom = null;
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
  }
  document.addEventListener('pointerup', lpCancel);
  document.addEventListener('pointercancel', lpCancel);

  document.addEventListener('click', function (e) {
    var t = e.target;

    var day = t.closest('.day');
    if (day) {
      if (Date.now() - lpDoneAt < 600) { lpDoneAt = 0; return; }
      var key = day.getAttribute('data-date');
      var now = Date.now();
      /* 双击同一天 → 直接进入记录体重 */
      var dbl = lastDayTap.key === key && now - lastDayTap.at < 360;
      lastDayTap.key = dbl ? null : key;
      lastDayTap.at = dbl ? 0 : now;
      if (day.classList.contains('ghost')) {
        var gd = parseYmd(key);
        ui.y = gd.getFullYear(); ui.m = gd.getMonth();
      }
      ui.sel = key;
      renderCalendar();
      if (dbl) openWeightSheet(key);
      return;
    }

    if (t.closest('#prev-month')) { shiftMonth(-1); return; }
    if (t.closest('#next-month')) { shiftMonth(1); return; }
    if (t.closest('#go-today')) { focusToday(); renderCalView(); return; }
    if (t.closest('#help-btn')) { helpTipEl.hidden = false; return; }
    if (t.closest('#tab-add')) {
      /* 当前在哪一页，就记哪一页的数据 */
      if (curPage === 'measure') openMeasureSheet(TODAY_KEY, null, {}, true);
      else openWeightSheet(TODAY_KEY, undefined, true);
      return;
    }
    if (t.closest('#open-bmi')) { openBmiSheet(); return; }
    if (t.closest('#goal-line')) { openGoalSheet(); return; }

    var tab = t.closest('.tab');
    if (tab) { switchPage(tab.getAttribute('data-tab')); return; }

    var chip = t.closest('.mchip');
    if (chip) {
      var mk = chip.getAttribute('data-metric');
      var nowC = Date.now();
      if (lastChipTap.key === mk && nowC - lastChipTap.at < 360) {
        lastChipTap.key = null; lastChipTap.at = 0;
        ui.metric = mk;
        renderMeasure();
        openMetricSheet(mk);
        return;
      }
      lastChipTap.key = mk; lastChipTap.at = nowC;
      ui.metric = mk;
      renderMeasure();
      return;
    }
    if (t.closest('#hist-more')) { histOpen = !histOpen; renderMeasure(); return; }
    var mdelRow = t.closest('[data-mdel]');
    if (mdelRow) { deleteMeasureAt(mdelRow.getAttribute('data-mdel')); return; }
    var edit = t.closest('[data-edit]');
    if (edit) { openMeasureSheet(edit.getAttribute('data-edit')); return; }

    if (t.closest('#clear-all')) { openClearMeasure(); return; }

    /* 备份页 */
    if (t.closest('#backup-now')) {
      if (!hasData()) { toast('还没有记录可以备份'); return; }
      saveSnapshot(newBackup());
      return;
    }
    if (t.closest('#reset-data')) { openResetSheet(); return; }
    if (t.closest('#import-file')) { fileInputEl.value = ''; fileInputEl.click(); return; }
    var rbk = t.closest('[data-restore]');
    if (rbk) { restoreBackup(rbk.getAttribute('data-restore')); return; }
    var dbk = t.closest('[data-delbk]');
    if (dbk) { deleteBackup(dbk.getAttribute('data-delbk')); return; }

    /* 弹层内部 */
    if (t.closest('#imp-merge')) { applyImport('merge'); return; }
    if (t.closest('#imp-replace')) { applyImport('replace'); return; }
    var usel = t.closest('[data-unit-set]');
    if (usel) { switchUnitTo(usel.getAttribute('data-unit-set')); return; }
    if (t.closest('[data-confirm-ok]')) { confirmOk(); return; }
    if (t.closest('[data-confirm-cancel]')) { confirmCancel(); return; }
    if (t.closest('[data-close]')) { closeSheet(); return; }
    if (t.closest('#w-more')) { wOpen = !wOpen; renderWeight(); return; }
    var wdel = t.closest('[data-wdelkey]');
    if (wdel) { deleteWeightAt(wdel.getAttribute('data-wdelkey')); return; }
    if (t.closest('#clear-weight')) { openClearWeight(); return; }
    var wedit = t.closest('[data-wedit]');
    if (wedit) { openWeightSheet(wedit.getAttribute('data-wedit')); return; }

    if (t.closest('#num-save')) {
      if (numCtx && numCtx.kind === 'metric') saveMetricValue(); else saveWeight();
      return;
    }
    if (t.closest('#goal-save')) { saveGoal(); return; }
    if (t.closest('#goal-clear')) { clearGoal(); return; }
    if (t.closest('#bmi-save')) { saveBmi(); return; }
    if (t.closest('#m-del-one')) { deleteMetricValue(); return; }
    if (t.closest('#m-save')) { saveMeasure(); return; }
  });

  /* 关闭弹层：有确认框时按「取消」处理 */
  function dismissSheet() {
    if (pendingConfirm) confirmCancel(); else closeSheet();
  }

  overlayEl.addEventListener('click', dismissSheet);

  fileInputEl.addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () { importText(String(reader.result)); };
    reader.onerror = function () { toast('文件读取失败'); };
    reader.readAsText(f, 'utf-8');
  });

  /* 教程：点任意位置关闭 */
  helpTipEl.addEventListener('click', function () { helpTipEl.hidden = true; });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheetEl.classList.contains('on')) dismissSheet();
  });

  /* 日历左右滑动换月 */
  var touchStart = null;
  calendarEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  calendarEl.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var t0 = e.changedTouches[0];
    var dx = t0.clientX - touchStart.x;
    var dy = t0.clientY - touchStart.y;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) shiftMonth(dx < 0 ? 1 : -1);
    touchStart = null;
  }, { passive: true });

  /* ================= 启动 ================= */
  store = loadStore();
  renderAll();
  switchPage('calendar');

})();
</script>
</body>
</html>
