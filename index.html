    if (t.closest('#add-weight-bar')) { openWeightSheet(TODAY_KEY); return; }
    if (t.closest('#open-bmi')) { openBmiSheet(); return; }
    if (t.closest('#goal-line')) { openGoalSheet(); return; }
    if (t.closest('#open-add')) { openWeightSheet(TODAY_KEY, undefined, true); return; }

    var tab = t.closest('.tab');
    if (tab) { switchPage(tab.getAttribute('data-tab')); return; }

    var chip = t.closest('.mchip');
    if (chip) {
      var mk = chip.getAttribute('data-metric');
      var nowC = Date.now();
      if (lastChipTap.key === mk && nowC - lastChipTap.at < 360) {
        lastChipTap.key = null; lastChipTap.at = 0;
        ui.metric = mk;
        renderMeasure();
        openMetricSheet(mk);
        return;
      }
      lastChipTap.key = mk; lastChipTap.at = nowC;
      ui.metric = mk;
      renderMeasure();
      return;
    }
    if (t.closest('#hist-more')) { histOpen = !histOpen; renderMeasure(); return; }
    if (t.closest('#add-measure')) { openMeasureSheet(TODAY_KEY); return; }
    var edit = t.closest('[data-edit]');
    if (edit) { openMeasureSheet(edit.getAttribute('data-edit')); return; }

    if (t.closest('#clear-all')) { openClearMeasure(); return; }

    /* 备份页 */
    if (t.closest('#backup-now')) {
      if (!hasData()) { toast('还没有记录可以备份'); return; }
      var nb = addBackup('manual');
      persist();
      renderBackup();
      if (folderState === 'ready' && dirHandle) {
        /* 已选备份文件夹：直接写进去 */
        writeFileFor(nb).then(function () {
          markSaved();
          toast('已存到「' + store.settings.folder + '」');
        }).catch(function () { toast('已留存本机备份，写入文件夹失败'); });
      } else {
        var p = null;
        try { p = saveViaPicker(fileTextOf(nb), fileNameOf(nb.at)); } catch (e) { p = null; }
        if (p) {
          /* 没选过文件夹：让用户选一个位置 */
          p.then(function () {
            markSaved();
            toast('已存到所选位置');
          }).catch(function (err) {
            if (err && err.name === 'AbortError') { toast('未选择保存位置'); return; }
            flashDownload(fileTextOf(nb), fileNameOf(nb.at));
            markSaved();
            toast('已备份到手机下载文件夹');
          });
        } else {
          /* 手机浏览器没有选位置的能力：存入下载文件夹 */
          flashDownload(fileTextOf(nb), fileNameOf(nb.at));
          markSaved();
          toast('已备份到手机下载文件夹');
        }
      }
      return;
    }
    var fbtn = t.closest('#folder-act');
    if (fbtn) {
      if (fbtn.getAttribute('data-act') === 'grant') grantFolder(); else pickFolder();
      return;
    }
    if (t.closest('#reset-data')) { openResetSheet(); return; }
    if (t.closest('#export-file')) { exportFile(); return; }
    if (t.closest('#import-file')) { fileInputEl.value = ''; fileInputEl.click(); return; }
    var rbk = t.closest('[data-restore]');
    if (rbk) { restoreBackup(rbk.getAttribute('data-restore')); return; }
    var dbk = t.closest('[data-delbk]');
    if (dbk) { deleteBackup(dbk.getAttribute('data-delbk')); return; }

    /* 弹层内部 */
    if (t.closest('#imp-merge')) { applyImport('merge'); return; }
    if (t.closest('#imp-replace')) { applyImport('replace'); return; }
    if (t.closest('#unit-switch')) {
      var hadPick = !!document.getElementById('num-date');
      var typedKg = r2(fromDisp(numCtx.val));
      setUnit(unitOf() === 'jin' ? 'kg' : 'jin');
      openWeightSheet(ui.sheetDate, isFinite(typedKg) ? parseFloat(fmtW(typedKg)) : undefined, hadPick);
      return;
    }
    if (t.closest('[data-confirm-ok]')) { confirmOk(); return; }
    if (t.closest('[data-confirm-cancel]')) { confirmCancel(); return; }
    if (t.closest('[data-close]')) { closeSheet(); return; }

    if (t.closest('#num-save')) {
      if (numCtx && numCtx.kind === 'metric') saveMetricValue(); else saveWeight();
      return;
    }
    if (t.closest('#goal-save')) { saveGoal(); return; }
    if (t.closest('#goal-clear')) { clearGoal(); return; }
    if (t.closest('#bmi-save')) { saveBmi(); return; }
    if (t.closest('#w-del')) {
      delete store.weights[ui.sheetDate];
        persist(); closeSheet(); renderAll(); return;
    }
    if (t.closest('#m-del-one')) { deleteMetricValue(); return; }
    if (t.closest('#m-save')) { saveMeasure(); return; }
    if (t.closest('#m-del')) {
      delete store.measures[ui.sheetDate];
        persist(); closeSheet(); renderMeasure(); return;
    }
  });

  overlayEl.addEventListener('click', function () {
    if (pendingConfirm) confirmCancel(); else closeSheet();
  });

  fileInputEl.addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () { importText(String(reader.result)); };
    reader.onerror = function () { toast('文件读取失败'); };
    reader.readAsText(f, 'utf-8');
  });

  /* 教程：点任意位置关闭 */
  helpTipEl.addEventListener('click', function () { helpTipEl.hidden = true; });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !sheetEl.classList.contains('on')) return;
    if (pendingConfirm) confirmCancel(); else closeSheet();
  });

  /* 日历左右滑动换月 */
  var touchStart = null;
  calendarEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  calendarEl.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var t0 = e.changedTouches[0];
    var dx = t0.clientX - touchStart.x;
    var dy = t0.clientY - touchStart.y;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) shiftMonth(dx < 0 ? 1 : -1);
    touchStart = null;
  }, { passive: true });

  /* ================= 启动 ================= */
  store = loadStore();
  renderAll();
  switchPage('calendar');
  restoreDirHandle();

})();
</script>
</body>
</html>
